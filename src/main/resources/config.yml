# Configuration générale de SHHypeVotes
general:
  # Nombre minimum de joueurs en ligne pour tenter de lancer un Hype Train automatiquement.
  min-players-online-for-random-start: 25
  # Fenêtre d'intervalle (en minutes) après laquelle un Hype Train aléatoire peut démarrer.
  # Le plugin choisira un délai aléatoire entre 'min' et 'max' pour tenter le prochain lancement,
  # si le nombre de joueurs minimum est atteint.
  random-start-interval-minutes: # minutes
    min: 160
    max: 280 
  # Durée du Hype Train en secondes.
  hype-duration-seconds: 1800 # 30 minutes
  # Format du countdown pour %time_remaining% et %duration%.
  # Exemples: "mm:ss", "HH:mm:ss", "M 'minutes' s 'secondes'"
  countdown-format: "HH'h'mm'm'ss's'"

# Configuration des sons (noms de sons de Minecraft, ex: ENTITY_PLAYER_LEVELUP, BLOCK_NOTE_BLOCK_PLING)
# Liste des sons: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
sounds:
  hype-start:
    enabled: true
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0 # De 0.0 à ... (Minecraft clamp, mais 1.0 est le volume normal)
    pitch: 1.0  # De 0.5 à 2.0 (1.0 est la hauteur normale)
  goal-reach:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2
  hype-end:
    enabled: true
    sound: "ENTITY_FIREWORK_ROCKET_LARGE_BLAST" # Un son plus final
    volume: 1.0
    pitch: 0.8

# Configuration des paliers du Hype Train
# Les paliers DOIVENT être listés par ordre croissant de 'threshold'.
