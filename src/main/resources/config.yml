# ----------------------------------------------------------------#
#                  Configuration de SHHypeVotes                   #
# ----------------------------------------------------------------#
#
# Hype Train des votes : chaque vote reçu par SHVotesReward pendant un Hype Train fait monter un compteur de votes.
# Chaque palier atteint peut ajouter du temps au Hype, et à la fin les commandes du plus haut palier atteint
# sont lancées pour chaque votant. Un Hype Train se lance aussi tout seul, au hasard, quand assez de joueurs
# sont en ligne.
#
# Commandes (racine /shhypevotes, alias /shh, /hypevotes, /hv, /shhvote) :
#   /shhypevotes start    Démarre de force un Hype Train.
#   /shhypevotes stop     Arrête de force le Hype Train en cours, sans récompenses.
#   /shhypevotes end      Termine le Hype Train en cours en distribuant les récompenses atteintes.
#   /shhypevotes reload   Recharge config.yml et messages.yml (le bloc reseau demande un redémarrage). Un fichier
#                         invalide annule le rechargement. Un Hype en cours prend les nouveaux paliers (commandes de
#                         récompense comprises) et le nouvel intervalle de la barre de boss ; hype-duration-seconds ne
#                         s'applique qu'au Hype suivant.
#   /shhypevotes status   Affiche l'état du Hype Train.
#
# Permissions :
#   shhypevotes.admin           Toutes les commandes ci-dessus (op par défaut).
#   shhypevotes.admin.start, .stop, .end, .reload, .status   Une seule commande.
#
# Les textes sont dans messages.yml. Le résumé de chaque Hype Train terminé est écrit dans le fichier hype de SHLogs.

# Mode réseau : avec SHNetwork, un seul Hype Train pour tous les serveurs. Un seul serveur (le meneur) le fait
# tourner : départs au hasard (joueurs en ligne comptés sur tout le réseau), votes, paliers, fin et récompenses.
# Les autres serveurs lui transmettent les votes qu'ils reçoivent et affichent ses annonces, ses sons et sa barre
# de boss. Un votant connecté sur n'importe quel serveur compte comme en ligne. Le Hype en cours et ses votants sont
# gardés en base : si le meneur s'arrête, le serveur qui prend sa place le reprend (sans rien annoncer).
# /shhypevotes start, stop et end lancés sur un autre serveur sont transmis au meneur. Demande un redémarrage.
# Sans SHNetwork, cette section ne sert pas.
reseau:
  actif: true
  # Canal du bus SHNetwork
  canal: shhypevotes

general:
  # Nombre minimum de joueurs en ligne pour tenter de lancer un Hype Train automatiquement.
  min-players-online-for-random-start: 25
  # Fenêtre d'intervalle (en minutes) après laquelle un Hype Train aléatoire peut démarrer.
  # Le plugin choisira un délai aléatoire entre 'min' et 'max' pour tenter le prochain lancement,
  # si le nombre de joueurs minimum est atteint.
  random-start-interval-minutes: # minutes
    min: 160
    max: 280 
  # Durée du Hype Train en secondes.
  hype-duration-seconds: 1800 # 30 minutes
  # Format du countdown pour %time_remaining% et %duration%.
  # Exemples: "mm:ss", "HH:mm:ss", "M 'minutes' s 'secondes'"
  countdown-format: "HH'h'mm'm'ss's'"
  # Ne compter que les votes des joueurs en ligne au moment du vote.
  only-count-online-player-votes: false

# Configuration des sons (noms de sons de Minecraft, ex: ENTITY_PLAYER_LEVELUP, BLOCK_NOTE_BLOCK_PLING)
# Liste des sons: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
sounds:
  hype-start:
    enabled: true
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0 # De 0.0 à ... (Minecraft clamp, mais 1.0 est le volume normal)
    pitch: 1.0  # De 0.5 à 2.0 (1.0 est la hauteur normale)
  goal-reach:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2
  hype-end:
    enabled: true
    sound: "ENTITY_FIREWORK_ROCKET_LARGE_BLAST"
    volume: 1.0
    pitch: 0.8

# Configuration des paliers du Hype Train
# Les paliers DOIVENT être listés par ordre croissant de 'threshold'.
# Chaque palier a :
#   displayName             Nom du palier, avec codes couleur &.
#   threshold               Nombre de votes à atteindre.
#   time-extension-seconds  Secondes ajoutées au Hype quand le palier est atteint.
#   bossbar-theme-color     Couleur de la barre de boss à partir de ce palier.
#   commands                Commandes console lancées pour chaque votant à la fin du Hype, si c'est le plus haut
#                           palier atteint. %player% est le pseudo du votant.
goals:
  goal1:
    displayName: "&eLuckyBlock Jaune x1"
    threshold: 2
    time-extension-seconds: 0
    bossbar-theme-color: "GREEN"
    commands:
      - "qc queue %player% shwc %player% luckyblock give %player% YELLOW 1"
      - "qc queue %player% shwc %player% sm %player% &7&l« &d&lHYPE &8&l» &7Vous avez reçu &a1 LuckyBlock Jaune&7."
