bossbar:
  enabled: true
  # Intervalle de mise à jour de la bossbar en ticks (20 ticks = 1 seconde).
  update-interval-ticks: 20
  # %current_votes%, %goal_votes%, %goal_name%, %next_goal_votes%, %next_goal_name%, %time_remaining%, %total_votes_for_hype%
  format: "&d&lHYPE &f&l⚡ &7Votes: &e%current_votes%&7/&6%goal_votes% &7(&6%goal_name%&7) &7| Temps: &d%time_remaining%"
  # Style: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: "SOLID"
  # Couleur par défaut: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  color: "GREEN"

# Journal de fin de Hype Train, écrit dans le fichier hype de SHLogs.
logging:
  # Écrire le résumé de chaque Hype Train terminé.
  enabled: true
  # Ajouter la liste des votants au résumé.
  include-voter-list: true