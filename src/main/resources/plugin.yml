name: SHHypeVotes
version: '${project.version}'
main: org.Cry_Legende.sHHypeVotes.SHHypeVotes
api-version: '1.20'
author: Cry_Legende
description: Un système de Hype Train pour les votes avec récompenses par paliers.
depend: [SHVotesReward]
# SHNetwork est facultatif : sans lui, chaque serveur a son propre Hype Train comme avant.
softdepend: [SHLogs, SHNetwork]

commands:
  shh:
    description: Commande principale pour SHHypeVotes.
    aliases: [hypevotes, hv, shhvote]
    permission: shh.admin
    usage: "/shh <start|stop|end|reload|status>"

permissions:
  shh.admin:
    description: Permet d'utiliser toutes les commandes de SHHypeVotes.
    default: op
