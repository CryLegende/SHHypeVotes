name: SHHypeVotes
version: '${project.version}'
main: org.Cry_Legende.sHHypeVotes.SHHypeVotes
api-version: '1.20'
author: Cry_Legende
description: Un système de Hype Train pour les votes avec récompenses par paliers.
depend: [SHVotesReward]
# SHNetwork est facultatif : sans lui, chaque serveur a son propre Hype Train comme avant.
softdepend: [SHLogs, SHNetwork]

commands:
  shhypevotes:
    description: Administration de SHHypeVotes.
    aliases: [shh, hypevotes, hv, shhvote]
    usage: "/shhypevotes <start|stop|end|reload|status>"

permissions:
  shhypevotes.admin:
    description: Toutes les commandes d'administration de SHHypeVotes.
    default: op
    children:
      shhypevotes.admin.start: true
      shhypevotes.admin.stop: true
      shhypevotes.admin.end: true
      shhypevotes.admin.reload: true
      shhypevotes.admin.status: true
  shhypevotes.admin.start:
    description: Démarrer un Hype Train de force.
    default: false
  shhypevotes.admin.stop:
    description: Arrêter le Hype Train en cours sans récompenses.
    default: false
  shhypevotes.admin.end:
    description: Terminer le Hype Train en cours en distribuant les récompenses.
    default: false
  shhypevotes.admin.reload:
    description: Recharger config.yml et messages.yml.
    default: false
  shhypevotes.admin.status:
    description: Afficher l'état du Hype Train.
    default: false
